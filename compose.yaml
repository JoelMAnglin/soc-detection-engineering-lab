name: soc-detection-engineering-lab
services:
  soc-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-detection-lab
    ports:
      - "8080:8080"
    environment:
      SOC_DB_PATH: /data/soc.db
      SOC_DATASET_PATH: /app/data/events.jsonl
      SOC_MODE: synthetic
    volumes:
      - soc-data:/data
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  soc-data:

